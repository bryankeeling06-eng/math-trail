<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Math Trail</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;font-family:sans-serif;background:#0e2a3a;color:#1b2a41}
    #wrap{display:flex;align-items:center;justify-content:center;height:100%}
    #stage{position:relative;width:min(1100px,100vw);height:min(720px,100vh);background:#7ec8ff;border-radius:18px;overflow:hidden}
    canvas{display:block;width:100%;height:100%}
    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .overlay>*{pointer-events:auto}
    .menu,.endcard,.shop{background:#fff;padding:24px;border-radius:24px;width:min(420px,90%);text-align:center}
    .go,.again,.shopBtn{width:100%;border:0;background:#2fa84a;color:#fff;font-size:22px;padding:12px;border-radius:14px;cursor:pointer;margin-top:8px}
    .shopBtn{background:#ff8a3c}
    .hidden{display:none!important}
    .hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px}
    .answers{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:none;gap:10px}
    .answers.show{display:flex}
    .ans{width:90px;height:56px;font-size:24px}
    .problem-banner{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#fff;padding:8px 20px;border-radius:16px;opacity:0}
    .problem-banner.show{opacity:1}
  </style>
</head>
<body>
<div id="wrap"><div id="stage">
<canvas id="game"></canvas>
<div class="hud">
  <div id="hearts">hearts</div><div id="scoreChip">0</div><div id="stoneChip"></div>
  <button id="fullBtn">FS</button><button id="pauseBtn">P</button><button id="muteBtn">M</button>
</div>
<div id="pauseMask" class="hidden"><button class="go" id="resumeBtn">Resume</button></div>
<div class="problem-banner" id="problemBanner"></div>
<div id="levelChip"></div><div id="toast"></div>
<div class="answers" id="answers"><button class="ans" data-i="0">0</button><button class="ans" data-i="1">0</button><button class="ans" data-i="2">0</button></div>
<div class="overlay">
  <div class="menu" id="menu">
    <h1>Math Trail</h1>
    <button class="mode selected" data-mode="add">Add</button>
    <button class="mode" data-mode="sub">Sub</button>
    <button class="mode" data-mode="mix">Mix</button>
    <button class="go" id="startBtn">Start Trail</button>
    <button class="go hidden" id="continueBtn">Continue</button>
    <button class="shopBtn" id="shopOpen">Shop</button>
    <div id="starBank"></div><div id="runGoal"></div>
  </div>
  <div class="shop hidden" id="shop"><div id="shopStars"></div><div id="shopGrid"></div><button id="shopBack">Back</button></div>
  <div class="endcard hidden" id="endcard"><h1 id="endTitle"></h1><p id="endStats"></p><p id="endStars"></p><p id="endStamps"></p><button class="again" id="againBtn">Play again</button></div>
</div>
</div></div>
<script>
function loadText(url){return fetch(url,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(url);return r.text();});}
function clean(t){if(!t)return "";var s=String(t).trim();if(s==="see local"||s.charAt(0)==="<")return "";return t;}
Promise.all([
  loadText("game-a.js"),
  loadText("game-b.js").catch(function(){return loadText("game-b (1).js");}),
  loadText("game-c.js").catch(function(){return "";}),
  loadText("game-d.js").catch(function(){return "";}),
  loadText("game-e.js").catch(function(){return "";}),
  loadText("game-f.js").catch(function(){return "";})
]).then(function(parts){(0,eval)(parts.map(clean).join("\n"));}).catch(function(e){console.error(e);});
</script>
</body></html>
